data_root: data/raw/epa_nfa/extracted
chemical_mapping: data/derived/chemical_mapping.csv
results_dir: results
seeds: [0, 1, 2]
outer_folds: 5
inner_folds: 3
primary_endpoints:
  - meanfiringrate
  - burst.per.min
  - nAE
  - ns.n
  - r
xgboost:
  max_depth: [2, 4]
  learning_rate: [0.03, 0.08]
  min_child_weight: [1, 5]
  colsample_bytree: [0.7, 1.0]
  subsample: 0.8
  n_estimators: 400
  early_stopping_rounds: 30
  n_jobs: 4
  parallel_configs: 4

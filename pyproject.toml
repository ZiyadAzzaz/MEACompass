[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neurochip-twin"
version = "0.1.0"
description = "Reliability-aware early prediction for neural MEA assays"
requires-python = ">=3.11,<3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy==2.4.6",
  "pandas==3.0.6",
  "scipy==1.17.1",
  "scikit-learn==1.9.1",
  "xgboost==3.2.0",
  "rdkit==2026.3.6",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
include = ["neurochip*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

